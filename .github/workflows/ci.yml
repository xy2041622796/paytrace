name: CI

on:
  push:
  pull_request:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      # 在 GitHub 仓库 Settings → Secrets and variables → Actions → Variables 添加这两个值；
      # 未配置时为空串，构建仍通过，但产物无法连库（仅影响部署产物）。
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 使用 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（npm ci）
        run: npm ci

      - name: 回归断言（verify）
        run: npm run verify

      - name: 静态检查（lint）
        run: npm run lint

      - name: 构建（build）
        run: npm run build
