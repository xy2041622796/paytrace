name: CI

on:
  push:
  pull_request:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 使用 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（npm ci）
        run: npm ci

      - name: 回归断言（verify）
        run: npm run verify

      - name: 静态检查（lint）
        run: npm run lint

      - name: 构建（build）
        run: npm run build
